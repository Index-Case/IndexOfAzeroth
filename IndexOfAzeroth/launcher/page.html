<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Index of Azeroth</title>
<link rel="preload" href="art/landing.webp" as="image">
<link rel="preload" href="art/landing_world.webp" as="image">
<link rel="preload" href="fonts/Marcellus-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body class="launcher-page">
<script src="words.js"></script>
<script src="loadbox.js"></script>
<script>
  const more = loadBox.more;
  const changes = Object.assign(document.createElement("div"), { className: "loadbox-changes" });
  const size = document.createElement("div");
  const keys = Object.assign(document.createElement("div"), { className: "loadbox-keys" });
  const key = (choice) => {
    const b = Object.assign(document.createElement("button"), { type: "button", className: "key small" });
    b.onclick = () => {
      more.replaceChildren();
      fetch("/launcher/choice", { method: "POST", body: JSON.stringify({ choice }) });
    };
    return b;
  };
  const update = key("update"), later = key("later");
  keys.append(size, update, later);
  function show(s) {
    loadBox.show({ line: [s.news, s.line].filter(Boolean).join(" "),
      share: s.phase === "installing" ? (s.total ? s.done / s.total : 0) : null });
    if (changes.dataset.text !== (s.changes || "")) {
      changes.dataset.text = s.changes || "";
      changes.replaceChildren(...changeRows(document, changes.dataset.text));
    }
    const offer = s.phase === "updated";
    size.textContent = offer ? s.size : "";
    update.textContent = s.update || "";
    later.textContent = s.later || "";
    const shown = offer ? [changes, keys] : changes.children.length ? [changes] : [];
    if (shown.length !== more.children.length) more.replaceChildren(...shown);
  }
  async function indexUp() {
    try {
      return (await fetch("/api/state", { cache: "no-store" })).ok;
    } catch (e) {
      return false;
    }
  }
  async function tick() {
    try {
      const r = await fetch("/launcher/state", { cache: "no-store" });
      if (r.ok) {
        show(await r.json());
        return setTimeout(tick, 500);
      }
    } catch (e) {
    }
    if (await indexUp()) return location.replace("/");
    setTimeout(tick, 1000);
  }
  tick();
</script>
</body>
</html>
